# Publish the market index from `market/` so the Discover page can read it.
#
# The index must be reachable at a stable https URL. Serving the directory as-is
# keeps `icons/tavern.svg` resolvable as a relative reference from `index.json`,
# which is what the market format expects.
#
# Enable this under Settings → Pages → Source: GitHub Actions, once.
name: Pages

on:
  push:
    branches: [master]
    paths:
      - 'market/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: market
      - id: deployment
        uses: actions/deploy-pages@v4
