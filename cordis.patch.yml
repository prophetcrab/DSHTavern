# DSHTavern bundle:
# - the host plugin keeps the tavern workspace marker, Web-panel routes, and
#   the workspace-level prompt assembly (D005) registered per tavern agent;
# - the remaining rows declare the internal tavern presets. They mount no
#   prompt rows: host assembly is the sole system-prompt source, and the
#   presets give tavern sessions a clean scope without tools/persona. They are
#   hidden from the global preset roster and bound automatically by workspace
#   mode (role-play / novel).
- insert:
    - id: dshtavern
      name: dshtavern
# Usage statistics live in their own row so the feature can be removed or
# disabled without touching the tavern plugin: removing this line unregisters
# `/tavern-stats/*` and the toolbox entry reports the feature as unavailable.
- insert:
    - id: dshtavern-stats
      name: 'dshtavern/stats'
# Story tracking runs beside the conversation on its own schedule. Removing
# this row unregisters `/tavern-tracker/*`, the toolbox entry reports the
# feature as unavailable, and the turn rail stops being marked; the tavern is
# unaffected either way.
- insert:
    - id: dshtavern-tracker
      name: 'dshtavern/tracker'
# Image generation is a separate row too. It is enabled by default, but every
# tavern still has to opt in through its own `.dshtavern/image.json`; the row
# never generates anything by itself. Disable this row to remove
# `/tavern-image/*` and leave the toolbox tile greyed out.
- insert:
    - id: dshtavern-image
      name: 'dshtavern/image'
# The two tavern presets. They mount no prompt rows: host assembly is the sole
# system-prompt source, and the presets give tavern sessions a clean scope
# without tools or persona. They are hidden from the global preset roster and
# bound automatically by workspace mode (role-play / novel). Each row names a
# subpath of this package rather than the shared upstream preset module, because
# the plugin manager reads a row's display name from `<specifier>/locale`, and a
# shared specifier cannot tell the two rows apart.
- insert:
    - id: preset-tavern-rp
      name: 'dshtavern/preset-rp'
      config:
        id: tavern-rp
        name: 酒馆 · 角色扮演
        description: 角色扮演会话的作用域。系统提示词由工作区编排提供，本预置只负责给会话一个干净的起点。
        order: 11
        plugins: []
- insert:
    - id: preset-tavern-novel
      name: 'dshtavern/preset-novel'
      config:
        id: tavern-novel
        name: 酒馆 · 小说
        description: 小说模式会话的作用域。提示词块与编排尚未实现，目前发出消息不会得到回复。
        order: 12
        plugins: []
